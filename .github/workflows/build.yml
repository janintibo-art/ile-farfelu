name: Compilation Île Farfelue

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  VENDORS_VERSION: "3.1.2-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Java 17 (pour Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK Android (outils pour le Quest)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "ndk;23.2.8568313" > /dev/null

      - name: Godot + modèles d'export
        run: |
          cd "$RUNNER_TEMP"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          echo "GODOT=$RUNNER_TEMP/godot" >> "$GITHUB_ENV"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" 'templates/windows_*_x86_64*.exe' 'templates/android_source.zip' 'templates/version.txt' -d tpl
          mv tpl/templates/* "$T/"
          rm -f "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

      - name: Plugin OpenXR Meta (Quest)
        run: |
          cd "$RUNNER_TEMP"
          wget -q "https://github.com/GodotVR/godot_openxr_vendors/releases/download/${VENDORS_VERSION}/godotopenxrvendorsaddon.zip"
          unzip -q godotopenxrvendorsaddon.zip 'asset/addons/*' -d vendors
          mkdir -p "$GITHUB_WORKSPACE/addons"
          cp -r vendors/asset/addons/godotopenxrvendors "$GITHUB_WORKSPACE/addons/"

      - name: Réglages de l'éditeur (SDK + clé de signature fixe)
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/cles/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed -i 's/^ *//' "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"

      - name: Import du projet
        run: |
          timeout 300 "$GODOT" --headless --import || true
          timeout 300 "$GODOT" --headless --import || true

      - name: Export PC (.exe)
        run: |
          mkdir -p build/windows
          "$GODOT" --headless --export-release "Windows" build/windows/IleFarfelue.exe
          test -f build/windows/IleFarfelue.exe
          printf '@echo off\r\nstart "" "%%~dp0IleFarfelue.exe" --xr-mode on\r\n' > build/windows/Lancer_en_VR.bat
          cd build && zip -qr IleFarfelue_PC.zip windows

      - name: Export Quest 2 (.apk)
        run: |
          "$GODOT" --headless --install-android-build-template --export-debug "Quest" build/IleFarfelue.apk
          test -f build/IleFarfelue.apk
          ls -la build

      - name: Garder les fichiers (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: ile-farfelue
          path: |
            build/IleFarfelue.apk
            build/IleFarfelue_PC.zip

      - name: Publier la dernière version (téléchargeable depuis le téléphone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete derniere-version --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create derniere-version build/IleFarfelue.apk build/IleFarfelue_PC.zip -R "$GITHUB_REPOSITORY" --title "Île Farfelue - build ${{ github.run_number }}" --notes "APK pour Quest 2 (à installer avec Bugjaeger) et version PC VR (SteamVR / Quest Link)." --target "$GITHUB_SHA"
